<!doctype html>
<html
  xmlns:th="https://www.thymeleaf.org"
  th:lang="${#locale.toLanguageTag}"
  th:fragment="html (head, content)"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:if="${head == null}" th:text="${site.title}">Site Title</title>
    <th:block th:if="${head != null}">
      <th:block th:replace="${head}" />
    </th:block>
    <script type="module" src="./js/main.ts"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <a class="site-title" th:href="@{/}" th:text="${site.title}">Site Title</a>
        <nav class="site-nav" th:with="menu = ${menuFinder.getPrimary()}">
          <th:block
            th:replace="~{modules/menu-tree :: tree(menuItems=${menu.menuItems})}"
          ></th:block>
        </nav>
      </div>
    </header>

    <main class="site-main">
      <div class="container">
        <th:block th:replace="${content}" />
      </div>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p th:text="${theme.config.basic.custom_footer ?: site.title}"></p>
        <halo:footer />
      </div>
    </footer>
  </body>
</html>
