name: CD

on:
  release:
    types:
      - published

jobs:
  test-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test build workflow
        run: pnpm test:build

  cd:
    needs: test-build
    # https://github.com/halo-sigs/reusable-workflows?tab=readme-ov-file#theme
    uses: halo-sigs/reusable-workflows/.github/workflows/theme-cd.yaml@v4
    secrets:
      halo-pat: ${{ secrets.HALO_PAT }}
    permissions:
      contents: write
    with:
      # if you have permission to release to appstore, please set this to false and set the app-id
      skip-appstore-release: true
      app-id: app-foo
      pnpm-version: "12.4.2"
      node-version: "24.21.0"
