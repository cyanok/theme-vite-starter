name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check

      - name: Test build workflow
        run: pnpm test:build

      - name: Build
        run: pnpm build-only

      - name: Verify build output
        run: pnpm verify:build

      - name: Package theme
        run: |
          pnpm exec theme-package
          compgen -G 'dist/*.zip' > /dev/null
