<nav
  class="pagination"
  aria-label="Post pagination"
  th:attr="aria-label=#{pagination.posts}"
  th:if="${posts.hasPrevious() || posts.hasNext()}"
>
  <a th:if="${posts.hasPrevious()}" th:href="@{${posts.prevUrl}}" th:text="#{pagination.previous}"
    >Previous</a
  >
  <span th:text="|${posts.page} / ${posts.totalPages}|"></span>
  <a th:if="${posts.hasNext()}" th:href="@{${posts.nextUrl}}" th:text="#{pagination.next}">Next</a>
</nav>
