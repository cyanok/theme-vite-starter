<include src="layout.html">
  <template name="head">
    <title th:text="${site.title}">Home</title>
    <script type="module" src="./js/index.ts"></script>
  </template>

  <h1 class="sr-only" th:text="${site.title}">Home</h1>
  <p th:if="${#lists.isEmpty(posts.items)}">No posts yet.</p>
  <ul class="post-list" th:if="${not #lists.isEmpty(posts.items)}">
    <include src="post-card.html"></include>
  </ul>

  <include src="pagination.html"></include>
</include>
