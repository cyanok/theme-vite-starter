<include src="layout.html">
  <template name="head">
    <title th:text="|${tag.spec.displayName} - ${site.title}|">Tag Archive</title>
  </template>

  <h1 th:text="#{tag.heading(${tag.spec.displayName})}"></h1>

  <p th:if="${#lists.isEmpty(posts.items)}" th:text="#{empty.posts}">No posts yet.</p>
  <ul class="post-list" th:if="${not #lists.isEmpty(posts.items)}">
    <include src="post-card.html"></include>
  </ul>

  <include src="pagination.html"></include>
</include>
