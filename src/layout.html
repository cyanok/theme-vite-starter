<!doctype html>
<html
  xmlns:th="https://www.thymeleaf.org"
  th:lang="${#locale.toLanguageTag}"
  th:fragment="html (head, content)"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:if="${head == null}" th:text="${site.title}">Site Title</title>
    <th:block th:if="${head != null}">
      <th:block th:replace="${head}" />
    </th:block>
    <script type="module" src="/assets/js/main.ts"></script>
  </head>
  <body>
    <header th:replace="~{modules/header :: header}"></header>

    <main class="site-main">
      <div class="container">
        <th:block th:replace="${content}" />
      </div>
    </main>

    <footer th:replace="~{modules/footer :: footer}"></footer>
  </body>
</html>
